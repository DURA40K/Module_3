{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Интернет-магазин{% endblock %}</title>

    <!-- CSS: автоматический выбор версии -->
    {% if debug %}
    <!-- Development version - для разработки -->
    <link rel="stylesheet" href="{% static 'shop/css/styles/main.css' %}" />
    {% else %}
    <!-- Production version - для продакшена -->
    <link rel="stylesheet" href="{% static 'shop/css/styles/main.min.css' %}" />
    {% endif %}

    <!-- Дополнительные CSS -->
    {% block extra_css %}{% endblock %}
    
    <style>
      /* Footer Styles */
      .footer {
        background-color: #2c3e50;
        color: white;
        margin-top: 60px;
        padding: 40px 20px 20px;
      }
      
      .footer__content {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 30px;
        margin-bottom: 30px;
        max-width: 1200px;
        margin-left: auto;
        margin-right: auto;
      }
      
      .footer__section {
        margin-bottom: 20px;
      }
      
      .footer__title {
        color: white;
        font-size: 1.2rem;
        font-weight: bold;
        margin-bottom: 15px;
        margin-top: 0;
      }
      
      .footer__list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      
      .footer__list li {
        margin-bottom: 10px;
      }
      
      .footer__link {
        color: rgba(255, 255, 255, 0.85);
        text-decoration: none;
        transition: color 0.3s;
      }
      
      .footer__link:hover {
        color: #3498db;
        text-decoration: underline;
      }
      
      .footer__text {
        color: rgba(255, 255, 255, 0.85);
        line-height: 1.8;
        margin: 0;
      }
      
      .footer__bottom {
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        padding-top: 20px;
        text-align: center;
        max-width: 1200px;
        margin-left: auto;
        margin-right: auto;
      }
      
      .footer__copyright {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.9rem;
        margin: 0;
      }
      
      /* Body layout fix */
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
      }
      
      main {
        flex: 1;
      }
      
      /* Admin buttons */
      .btn--warning {
        background-color: #ff9800;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        text-decoration: none;
        display: inline-block;
        transition: background-color 0.3s;
      }
      
      .btn--warning:hover {
        background-color: #f57c00;
      }
      
      /* Add product card */
      .product-card--add {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: 2px dashed rgba(255, 255, 255, 0.5);
        min-height: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-decoration: none !important;
        transition: all 0.3s ease;
        cursor: pointer;
        color: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      
      .product-card--add:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        border-color: white;
        text-decoration: none !important;
      }
      
      .product-card--add:focus,
      .product-card--add:active {
        text-decoration: none !important;
        outline: none;
      }
      
      .product-card__add-icon {
        width: 100%;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .plus-icon {
        font-size: 100px;
        font-weight: 200;
        color: white;
        line-height: 1;
      }
      
      .product-card--add .product-card__title {
        color: white;
        font-size: 1.5rem;
        margin-top: 20px;
        text-decoration: none !important;
      }
      
      .product-card--add .product-card__description {
        color: rgba(255, 255, 255, 0.9);
        text-decoration: none !important;
      }
      
      .product-card--add * {
        text-decoration: none !important;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">{% include 'nav.html' %}</div>
    </header>

    <!-- Main Content -->
    <main>{% block content %}{% endblock %}</main>

    <!-- Footer -->
    {% include 'footer.html' %}

    <!-- JavaScript -->
    {% block extra_js %}{% endblock %}
  </body>
</html>
